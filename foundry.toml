[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "./" }]
# ex/ 指向练习代码（你要填 TODO 的地方）
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "ex/=src/",
]

[profile.default.fuzz]
runs = 256

# 参考答案：FOUNDRY_PROFILE=solutions forge test
[profile.solutions]
src = "solutions"
out = "out-solutions"
cache_path = "cache-solutions"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "ex/=solutions/",
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
