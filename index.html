<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solidity 8 小时入门</title>
<meta name="description" content="写给 CS 毕业生的区块链与 Solidity 入门：8 章讲义、真实协议代码、Foundry 测试。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script>
  // 尽早设定主题，避免闪烁
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2 4 12l8 4.5L20 12 12 2Zm0 16.2L4 13.6 12 22l8-8.4-8 4.6Z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Solidity 8h</span>
        <span class="brand-sub">区块链入门课程</span>
      </span>
    </a>

    <button class="search-trigger" id="searchOpen" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>搜索讲义</span>
      <kbd>⌘K</kbd>
    </button>

    <nav class="nav" id="nav" aria-label="章节"></nav>

    <div class="sidebar-foot">
      <div class="progress-card">
        <div class="progress-head">
          <span>学习进度</span>
          <span id="progressText">0 / 8</span>
        </div>
        <div class="progress-bar"><span id="progressFill"></span></div>
      </div>
      <a class="foot-link" href="https://github.com/zealton/solidity-8h" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.3 1.1 2.9.8.1-.6.3-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
        <span>GitHub 仓库</span>
      </a>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar-shell"><header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开目录">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions">
        <button class="icon-btn mobile-search" id="searchOpen2" type="button" aria-label="搜索">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header></div>

    <div class="content-wrap">
      <main class="panel" id="view" tabindex="-1"></main>
      <aside class="toc" id="toc" aria-label="本页目录"></aside>
    </div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-dialog" role="dialog" aria-modal="true" aria-label="搜索">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="搜索概念、函数、协议…（如 重入、getAmountOut、清算）" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script src="assets/vendor/marked.min.js"></script>
<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>

<script src="assets/app.js"></script>
</body>
</html>
